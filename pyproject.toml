[project]
name = "mnemonica"
version = "0.1.0"
description = "Instance inheritance for Python: subtypes are real subclasses, and every instance keeps a live link to the instance it was made from."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ email = "went.out@gmail.com" }]
keywords = ["inheritance", "instance", "lineage", "provenance", "type-system"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    # PEP 508 direct reference: pip installs lethe from the git tag too
    # (uv reads the same line; no separate source entry needed). When
    # publishing to PyPI, replace with a plain "mnemonica-lethe>=0.1.0" —
    # PyPI rejects direct references.
    "mnemonica-lethe @ git+https://github.com/mythographica/lethe@v0.1.0",
]

[project.urls]
Homepage = "https://github.com/wentout/mnemonica-py"
Repository = "https://github.com/wentout/mnemonica-py"
Issues = "https://github.com/wentout/mnemonica-py/issues"

[project.scripts]
mnemonica-stubgen = "mnemonica.stubgen:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mnemonica --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["mnemonica"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# stubgen fixtures are checked WITH their generated stubs by
# tests/test_stubgen.py; without the stubs they intentionally do not
# type-check (that is what the stubs are for)
exclude = "^tests/fixtures/"

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["tests/fixtures"]

[tool.ruff]
target-version = "py312"
# Markdown code blocks are illustrative docs (plans, README), not shipped code.
exclude = ["*.md"]
# stubgen fixtures and their golden stubs are test data, not linted code
extend-exclude = ["tests/fixtures"]
